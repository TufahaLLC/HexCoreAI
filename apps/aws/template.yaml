    Description: Vision Analysis Agent Production Alias ID
    Value: !GetAtt VisionAnalysisAgentProdAlias.AgentAliasId

  EconomyAnalysisAgentProdAliasId:
    Description: Economy Analysis Agent Production Alias ID
    Value: !GetAtt EconomyAnalysisAgentProdAlias.AgentAliasId

  ChampionAnalysisAgentProdAliasId:
    Description: Champion Analysis Agent Production Alias ID
    Value: !GetAtt ChampionAnalysisAgentProdAlias.AgentAliasId

