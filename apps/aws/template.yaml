          POWERTOOLS_SERVICE_NAME: hexcore-synergy-orchestrator
          LOG_LEVEL: INFO
          AGENT_SESSIONS_TABLE: !Ref AgentSessionsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MatchDataTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AgentSessionsTable
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"
            - Effect: Allow
              Action:
                - bedrock:InvokeAgent
              Resource:
                - !GetAtt SynergyAnalysisAgent.AgentArn
                - !If
                  - CreateAliases
                  - !GetAtt SynergyAnalysisAgentProdAlias.AgentAliasArn
                  - !Ref AWS::NoValue

  AdaptationAgentOrchestratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: HexCore-AdaptationAgent-Orchestrator
      Handler: agents/orchestrators/adaptation-agent.handler
      CodeUri: ./dist
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          BEDROCK_AGENT_ID: !GetAtt AdaptationAnalysisAgent.AgentId
          BEDROCK_AGENT_ALIAS_ID:
            !If [
              CreateAliases,
              !GetAtt AdaptationAnalysisAgentProdAlias.AgentAliasId,
              "",
            ]
          ENABLE_BEDROCK_TRACES: !If [IsProduction, "true", "false"]
          POWERTOOLS_SERVICE_NAME: hexcore-adaptation-orchestrator
          LOG_LEVEL: INFO
          AGENT_SESSIONS_TABLE: !Ref AgentSessionsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MatchDataTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AgentSessionsTable
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"
            - Effect: Allow
              Action:
                - bedrock:InvokeAgent
              Resource:
                - !GetAtt AdaptationAnalysisAgent.AgentArn
                - !If
                  - CreateAliases
                  - !GetAtt AdaptationAnalysisAgentProdAlias.AgentAliasArn
                  - !Ref AWS::NoValue

  # ==================== Synthesizer Lambda Function ====================
  SynthesizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: HexCore-Synthesizer
      Handler: aggregation/synthesizer.handler
      CodeUri: ./dist
      Timeout: 60
      MemorySize: 1024
      Environment:
        Variables:
          RESULTS_BUCKET: !Ref ResultsBucket
          ANALYSIS_RESULTS_TABLE: !Ref AnalysisResultsTable
          POWERTOOLS_SERVICE_NAME: hexcore-synthesizer
          LOG_LEVEL: INFO
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AnalysisResultsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref IdempotencyTable
        - S3CrudPolicy:
            BucketName: !Ref ResultsBucket
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  # ==================== EventBridge ====================
  MatchFilteredReadyRule:
    Type: AWS::Events::Rule
    Properties:
      Name: HexCore-MatchFilteredReady
      Description: Triggers Step Functions when match data is ready
      EventPattern:
        source:
          - hexcore.match.processor
        detail-type:
          - match.filtered.ready
      State: ENABLED
      Targets:
        - Arn: !GetAtt MultiAgentStateMachine.Arn
          RoleArn: !GetAtt EventBridgeStepFunctionsRole.Arn
          Id: StepFunctionsTarget

  EventBridgeStepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeStepFunctions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource: !GetAtt MultiAgentStateMachine.Arn

  # ==================== Step Functions ====================
  MultiAgentStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: HexCore-MultiAgent-Orchestration
      Type: EXPRESS
      DefinitionUri: statemachine/multi-agent-orchestration.asl.json
      DefinitionSubstitutions:
        BuildAgentOrchestratorArn: !GetAtt BuildAgentOrchestratorFunction.Arn
        CombatAgentOrchestratorArn: !GetAtt CombatAgentOrchestratorFunction.Arn
        VisionAgentOrchestratorArn: !GetAtt VisionAgentOrchestratorFunction.Arn
        EconomyAgentOrchestratorArn: !GetAtt EconomyAgentOrchestratorFunction.Arn
        ChampionAgentOrchestratorArn: !GetAtt ChampionAgentOrchestratorFunction.Arn
        CompetitiveAgentOrchestratorArn: !GetAtt CompetitiveAgentOrchestratorFunction.Arn
        MacroAgentOrchestratorArn: !GetAtt MacroAgentOrchestratorFunction.Arn
        PositioningAgentOrchestratorArn: !GetAtt PositioningAgentOrchestratorFunction.Arn
        TemporalAgentOrchestratorArn: !GetAtt TemporalAgentOrchestratorFunction.Arn
        SynergyAgentOrchestratorArn: !GetAtt SynergyAgentOrchestratorFunction.Arn
        AdaptationAgentOrchestratorArn: !GetAtt AdaptationAgentOrchestratorFunction.Arn
        SynthesizerFunctionArn: !GetAtt SynthesizerFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref BuildAgentOrchestratorFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref CombatAgentOrchestratorFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref VisionAgentOrchestratorFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref EconomyAgentOrchestratorFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ChampionAgentOrchestratorFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref CompetitiveAgentOrchestratorFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref MacroAgentOrchestratorFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref PositioningAgentOrchestratorFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref TemporalAgentOrchestratorFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref SynergyAgentOrchestratorFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref AdaptationAgentOrchestratorFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref SynthesizerFunction
        - Statement:
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:AssociateKmsKey
              - logs:CreateLogDelivery
              - logs:GetLogDelivery
              - logs:UpdateLogDelivery
              - logs:DeleteLogDelivery
              - logs:ListLogDeliveries
              - logs:PutResourcePolicy
              - logs:PutDestination
              - logs:PutDestinationPolicy
              - logs:DescribeResourcePolicies
              - logs:DescribeLogGroups
            Resource: "*"
        - Statement:
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:DescribeLogStreams
              - logs:PutLogEvents
            Resource:
              - !GetAtt StateMachineLogGroup.Arn
              - !Sub "${StateMachineLogGroup.Arn}:log-stream:*"
      Tracing:
        Enabled: true
      Logging:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StateMachineLogGroup.Arn
    DependsOn:
      - StateMachineLogGroup

  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/stepfunctions/HexCore-MultiAgent
      RetentionInDays: 7

  # ==================== CloudWatch Alarms ====================
  DLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: HexCore-DLQ-Messages
      AlarmDescription: Alert when messages arrive in DLQ
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: QueueName
          Value: !GetAtt MatchDeadLetterQueue.QueueName

  QueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: HexCore-Queue-Age
      AlarmDescription: Alert when messages are old
      MetricName: ApproximateAgeOfOldestMessage
      Namespace: AWS/SQS
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 600
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: QueueName
          Value: !GetAtt MatchQueue.QueueName

# ==================== Outputs ====================
Outputs:
  WebSocketURL:
    Description: WebSocket API URL
    Value: !Sub wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}

  ConnectionsTableName:
    Description: Connections DynamoDB table name
    Value: !Ref ConnectionsTable

  MatchDataTableName:
    Description: Match Data DynamoDB table name
    Value: !Ref MatchDataTable

  MatchQueueUrl:
    Description: Match Queue URL
    Value: !Ref MatchQueue

  ResultsBucketName:
    Description: Results S3 bucket name
    Value: !Ref ResultsBucket

  IdempotencyTableName:
    Description: Idempotency DynamoDB table name
    Value: !Ref IdempotencyTable

  AgentSessionsTableName:
    Description: Agent Sessions DynamoDB table name
    Value: !Ref AgentSessionsTable

  AnalysisResultsTableName:
    Description: Analysis Results DynamoDB table name
    Value: !Ref AnalysisResultsTable

  SynthesizerFunctionArn:
    Description: Synthesizer Lambda Function ARN
    Value: !GetAtt SynthesizerFunction.Arn

  # Bedrock Agent IDs
  BuildAnalysisAgentId:
    Description: Build Analysis Agent ID
    Value: !GetAtt BuildAnalysisAgent.AgentId

  CombatAnalysisAgentId:
    Description: Combat Analysis Agent ID
    Value: !GetAtt CombatAnalysisAgent.AgentId

  VisionAnalysisAgentId:
