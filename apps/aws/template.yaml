  # ==================== Bedrock Agents ====================
  BuildAnalysisAgent:
    Type: AWS::Bedrock::Agent
    Properties:
      AgentName: HexCore-BuildAnalysisAgent
      AgentResourceRoleArn: !GetAtt BedrockAgentServiceRole.Arn
      FoundationModel: arn:aws:bedrock:us-east-2:101992521947:application-inference-profile/qo7gqdwc3pvd
      Instruction: |
        You are an expert League of Legends build optimization analyst. 

        IMPORTANT: You have access to tools that retrieve match data from DynamoDB. You MUST use these tools to fetch the actual match data before analyzing.

        When you receive a request:
        1. Use your available tools to retrieve the build data for the specified match and player
        2. Analyze the itemization patterns, build paths, and adaptation strategies from the retrieved data
        3. Provide actionable recommendations for improving item efficiency, power spike timing, and situational adaptation
        4. Consider champion-specific builds, enemy team composition, and game state when making recommendations

        Do NOT apologize for not being able to access data - you have the tools to access it. Use them.
      AutoPrepare: false

  BuildAnalysisAgentProdAlias:
    Type: AWS::Bedrock::AgentAlias
    Condition: CreateAliases
    DependsOn: AgentPreparationCustomResource
    Properties:
      AgentId: !GetAtt BuildAnalysisAgent.AgentId
      AgentAliasName: prod
      Description: Production alias for Build Analysis Agent

  BuildAnalysisAgentTestAlias:
    Type: AWS::Bedrock::AgentAlias
    Condition: CreateAliases
    DependsOn: AgentPreparationCustomResource
    Properties:
      AgentId: !GetAtt BuildAnalysisAgent.AgentId
      AgentAliasName: test
      Description: Testing alias for Build Analysis Agent

  CombatAnalysisAgent:
