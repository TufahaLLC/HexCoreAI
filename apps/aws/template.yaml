    Description: Vision Analysis Agent Testing Alias ID
    Value: !GetAtt VisionAnalysisAgentTestAlias.AgentAliasId

  EconomyAnalysisAgentTestAliasId:
    Description: Economy Analysis Agent Testing Alias ID
    Value: !GetAtt EconomyAnalysisAgentTestAlias.AgentAliasId

  ChampionAnalysisAgentTestAliasId:
    Description: Champion Analysis Agent Testing Alias ID
    Value: !GetAtt ChampionAnalysisAgentTestAlias.AgentAliasId

