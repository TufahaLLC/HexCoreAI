        3. Provide recommendations for improving vision coverage, objective control preparation, and enemy vision denial
        4. Consider game state, role requirements, and strategic importance of vision locations

        Do NOT apologize for not being able to access data - you have the tools to access it. Use them.
      AutoPrepare: false

