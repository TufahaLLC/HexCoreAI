  # ==================== Agent Preparation Custom Resource ====================
  AgentPreparationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: HexCore-AgentPreparation
      Handler: agent-preparation.handler
      CodeUri: ./dist
      Timeout: 300
      MemorySize: 256
      Environment:
        Variables:
          LOG_LEVEL: INFO
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:PrepareAgent
                - bedrock:GetAgent
                - bedrock:ListAgentVersions
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent/*"

  AgentPreparationCustomResource:
    Type: AWS::CloudFormation::CustomResource
    Condition: CreateAliases
    Properties:
      ServiceToken: !GetAtt AgentPreparationFunction.Arn
      AgentIds:
        - !GetAtt BuildAnalysisAgent.AgentId
        - !GetAtt CombatAnalysisAgent.AgentId
        - !GetAtt VisionAnalysisAgent.AgentId
        - !GetAtt EconomyAnalysisAgent.AgentId
        - !GetAtt ChampionAnalysisAgent.AgentId
        - !GetAtt CompetitiveAnalysisAgent.AgentId
        - !GetAtt MacroAnalysisAgent.AgentId
        - !GetAtt PositioningAnalysisAgent.AgentId
        - !GetAtt TemporalAnalysisAgent.AgentId
        - !GetAtt SynergyAnalysisAgent.AgentId
        - !GetAtt AdaptationAnalysisAgent.AgentId

  # ==================== Agent Orchestrator Lambda Functions ====================
  BuildAgentOrchestratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: HexCore-BuildAgent-Orchestrator
      Handler: agents/orchestrators/build-agent.handler
      CodeUri: ./dist
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          BEDROCK_AGENT_ID: !GetAtt BuildAnalysisAgent.AgentId
          BEDROCK_AGENT_ALIAS_ID:
            !If [
              CreateAliases,
              !GetAtt BuildAnalysisAgentProdAlias.AgentAliasId,
              "",
            ]
          ENABLE_BEDROCK_TRACES: !If [IsProduction, "true", "false"]
          POWERTOOLS_SERVICE_NAME: hexcore-build-orchestrator
          LOG_LEVEL: INFO
          AGENT_SESSIONS_TABLE: !Ref AgentSessionsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MatchDataTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AgentSessionsTable
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"
            - Effect: Allow
              Action:
                - bedrock:InvokeAgent
              Resource:
                - !GetAtt BuildAnalysisAgent.AgentArn
                - !If
                  - CreateAliases
                  - !GetAtt BuildAnalysisAgentProdAlias.AgentAliasArn
                  - !Ref AWS::NoValue

